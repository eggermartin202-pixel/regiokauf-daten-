# Baut die Korn-App (ios/Korn) und legt eine unsignierte IPA zum Sideloaden ab. Läuft nur bei Änderungen an der App.
name: iOS Build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {}

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Projekt erzeugen
        run: |
          brew install xcodegen
          cd ios/Korn && xcodegen generate
      - name: Für das iPhone bauen (unsigniert)
        run: |
          cd ios/Korn
          set +e
          xcodebuild -project Korn.xcodeproj -target Korn -sdk iphoneos \
            -configuration Release CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          status=$?
          grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -150
          exit $status
      - name: IPA packen
        run: |
          cd ios/Korn/build/Release-iphoneos
          mkdir Payload && cp -R Korn.app Payload/
          zip -qry "$GITHUB_WORKSPACE/Korn-unsigniert.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Korn-unsigniert
          path: Korn-unsigniert.ipa
          retention-days: 30
