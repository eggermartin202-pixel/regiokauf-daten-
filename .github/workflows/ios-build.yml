# Kompiliert die iOS-App (PolskiApp) auf einem macOS-Runner – prüft nur, ob der Code baut.
name: iOS-Build (Polski)

on:
  push:
    paths:
      - "PolskiApp/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: Build für den Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project PolskiApp/Polski.xcodeproj \
            -target Polski \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
