name: Korn
options:
  bundleIdPrefix: app.korn
  deploymentTarget:
    iOS: "17.0"
targets:
  Korn:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Korn
        NSCameraUsageDescription: Korn braucht die Kamera, um Fotos aufzunehmen. Alle Bilder werden nur auf dem Gerät verarbeitet.
        NSPhotoLibraryAddUsageDescription: Korn speichert deine entwickelten Fotos in der Fotomediathek.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: app.korn.camera
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
